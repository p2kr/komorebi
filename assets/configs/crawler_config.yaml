# Komorebi Crawler Site Configurations
# This file contains the default scraper profiles used by the parallel web crawler.

# Template Variables:
# {title} - title of anime/manga
# {number} - episode/chapter of anime/manga

nyaa:
  name: "Nyaa.si Anime Torrents"
  base_url: "https://nyaa.si/?page=rss&c=1_2&f=0&q={title}+{number}"
  item_selector: "item"
  title_selector: "title"
  link_selector: "link"
  popularity_selector: "seeders, nyaa\\:seeders"
  size_selector: "size, nyaa\\:size"
  is_active: true

animetosho:
  name: "AnimeTosho Torrents"
  base_url: "https://animetosho.org/search?q={title}+{number}"
  item_selector: "div.home_list_entry"
  title_selector: "div.link a"
  link_selector: "a[href^='magnet:']"
  popularity_selector: "span.seeders, div.links"
  size_selector: "div.size, span.size"
  is_active: true

tokyotosho:
  name: "Tokyo Toshokan"
  base_url: "https://tokyotosho.info/search.php?terms={title}+{number}"
  item_selector: "table.listing tr.main"
  title_selector: "td.desc-top a:not([website])"
  link_selector: "a[href^='magnet:']"
  popularity_selector: "td.stats-0"
  size_selector: "td.desc-top"
  is_active: false # Disabled: Server connection times out (522 Cloudflare Error)

subsplease:
  name: "SubsPlease API"
  base_url: "https://subsplease.org/api/?f=search&tz=UTC&s={title}"
  item_selector: "json"
  title_selector: "show"
  link_selector: "downloads"
  popularity_selector: null
  size_selector: "filesize"
  is_active: true

erairaws:
  name: "Erai-raws RSS"
  base_url: "https://www.erai-raws.info/rss-1080p/"
  item_selector: "item"
  title_selector: "title"
  link_selector: "link"
  popularity_selector: "seeders, erai\\:seeders"
  size_selector: "size, erai\\:size"
  is_active: false # Disabled: Returns 403 Forbidden (Cloudflare anti-bot protection)
