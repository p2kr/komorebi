name: Komorebi CI/CD

on:
  push:
    branches: [ "develop", "master" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [ "develop", "master" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal baseline: each job grants only what it needs.
permissions:
  contents: read

jobs:
  test:
    name: 🔍 Test & Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed by github-actions-report-lcov
    # Scoped here rather than globally to limit exposure to 3rd-party actions.
    env:
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: komorebi_client
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup Environment
        uses: ./.github/actions/setup-komorebi-env

      - name: 🧪 Test Go Sidecar with Coverage
        working-directory: komorebi_server
        run: |
          go test -coverprofile=coverage.out ./...
          go install github.com/jandelgado/gcov2lcov@v1.0.6
          $(go env GOPATH)/bin/gcov2lcov -infile=coverage.out -outfile=coverage.lcov

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: ⚙️ Generate code (build_runner & intl_utils)
        run: |
          dart run build_runner build
          dart run intl_utils:generate

      - name: 🔎 Verify Formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: 🧪 Run Static Analysis
        run: flutter analyze

      - name: 🧪 Run Unit Tests with Coverage
        run: flutter test --coverage

      # Explicitly install lcov to guard against runner image changes.
      - name: 🔧 Install lcov
        run: sudo apt-get install -y lcov

      - name: 🧹 Filter Generated Files from Coverage
        run: lcov --remove coverage/lcov.info 'lib/**/*.g.dart' 'lib/intl/generated/*' -o coverage/lcov.info --ignore-errors unused
        continue-on-error: true

      - name: 📊 Report Coverage to PR
        if: github.event_name == 'pull_request'
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: komorebi_client/coverage/lcov.info,komorebi_server/coverage.lcov
          minimum-coverage: 0
          artifact-name: komorebi-code-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true

      - name: 📤 Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: komorebi-coverage-report
          path: |
            komorebi_client/coverage/
            komorebi_server/coverage.lcov
            komorebi_server/coverage.out
          if-no-files-found: ignore

      - name: ☂️ Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: komorebi_client/coverage/lcov.info,komorebi_server/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false


  build:
    name: 🏗️ Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    # Scoped here rather than globally to limit exposure to 3rd-party actions.
    env:
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: komorebi_client
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Desktop
            os: windows-latest
            platform: windows
            sidecar-output: ../komorebi_client/assets/bin/komorebi_server.exe
            # Use tilde-expansion — env context is unavailable during matrix generation.
            pub-cache: ~\AppData\Local\Pub\Cache
            artifact-path: komorebi_client/build/windows/x64/runner/Release/
          - name: Linux Desktop
            os: ubuntu-latest
            platform: linux
            sidecar-output: ../komorebi_client/assets/bin/komorebi_server
            pub-cache: ~/.pub-cache
            artifact-path: komorebi_client/build/linux/x64/release/bundle/

    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install Linux Desktop Dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: 🔧 Setup Environment
        uses: ./.github/actions/setup-komorebi-env
        with:
          pub-cache: ${{ matrix.pub-cache }}

      - name: 🏗️ Build Go Sidecar
        working-directory: komorebi_server
        # Use bash on all platforms (available via Git Bash on Windows runners)
        # to ensure mkdir -p works cross-platform.
        shell: bash
        run: |
          mkdir -p "$(dirname "${{ matrix.sidecar-output }}")"
          go build -o ${{ matrix.sidecar-output }} .

      - name: ⚙️ Enable Desktop Support
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: ⚙️ Generate code (build_runner & intl_utils)
        run: |
          dart run build_runner build
          dart run intl_utils:generate

      - name: 🏗️ Build Release Bundle
        run: flutter build ${{ matrix.platform }} --release

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: komorebi-${{ matrix.platform }}-build
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error


  deploy_pages:
    name: 🚀 Deploy Auth Page to GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # needed to deploy to GitHub Pages
      id-token: write   # needed for OIDC token-based deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
