version: "2"
sql:
  - engine: "sqlite"
    queries: "src/db/query"
    schema: "src/db/schema"
    gen:
      go:
        package: "dbClient"
        out: "src/db/generated"
        emit_json_tags: true
        emit_empty_slices: true
        emit_sql_as_comment: true
        emit_pointers_for_null_types: true
        emit_interface: true
#        overrides:
#          - column: "*.created_at"
#            go_type: "time.Time"
#          - column: "*.updated_at"
#            go_type: "time.Time"
#          - column: "app_logs.timestamp"
#            go_type: "time.Time"
